<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title description">
<title id="title">Binary64 spacing grows with magnitude</title>
<desc id="description">A logarithmic staircase plot shows the upward gap between adjacent positive binary64 numbers from ten to the minus six through ten to the sixteen. The gap rises from about two times ten to the minus twenty-two to two. Separately magnified number lines compare spacing near one with spacing near two to the fifty-three.</desc>
<metadata>Generated deterministically by scripts/generate_binary64_spacing_figure.py using Python math.nextafter. The plotted values are finite positive IEEE 754 binary64 values.</metadata>
