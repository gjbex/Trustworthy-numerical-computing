<circle cx="890.0" cy="340.0" r="6.0" fill="#8E5AA7" stroke="#FFFFFF" stroke-width="2"/>
<text x="902.0" y="328.0" font-size="15" fill="#17324D" text-anchor="start" font-weight="600">x = (1, 1)</text>
<text x="890.0" y="178.0" font-size="15" fill="#5F6B76" text-anchor="middle" font-weight="600">angle ≈ 2.86e-11°: visually coincident</text>
<text x="890.0" y="584.0" font-size="17" fill="#17324D" text-anchor="middle" font-weight="600">x1</text>
<text x="656.0" y="340.0" font-size="17" fill="#17324D" text-anchor="middle" font-weight="600">x2</text>
<text x="600.0" y="602.0" font-size="20" fill="#17324D" text-anchor="middle" font-weight="700">Same RHS-input perturbation Δb = (0, 1e-16)</text>
<text x="600.0" y="626.0" font-size="15" fill="#5F6B76" text-anchor="middle" font-weight="400">Solution-displacement arrows below are independently magnified</text>
