<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
<title id="title">Geometry of the two-equation sensitivity experiment</title>
<desc id="description">Two coordinate-plane panels compare the lines defined by the Module 4 equations for delta equal to one and delta equal to ten to the minus twelve. The first pair crosses visibly; the second is visually coincident at the same scale. Independently magnified arrows show that the same right-hand-side perturbation moves the solution by ten to the minus sixteen and ten to the minus four, respectively.</desc>
<metadata>Generated deterministically by scripts/generate_two_equation_sensitivity_figure.py from the exact dimensionless equations and eta=1e-16. The coordinate panels share linear axes from zero to two. Displacement arrows use independent magnification.</metadata>
<rect width="1200" height="850" fill="#FFFFFF"/>
<style>text { font-family: system-ui, "Segoe UI", Arial, sans-serif; } line, rect, circle { vector-effect: non-scaling-stroke; }</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#8E5AA7"/></marker></defs>
<text x="55.0" y="43.0" font-size="29" fill="#17324D" text-anchor="start" font-weight="700">Nearly parallel equations amplify the same input change</text>
<text x="55.0" y="73.0" font-size="17" fill="#5F6B76" text-anchor="start" font-weight="400">Both coordinate panels use the same linear x1 and x2 scales</text>
<line x1="370.0" y1="103.0" x2="440.0" y2="103.0" stroke="#0072B2" stroke-width="3.2"/>
<text x="450.0" y="109.0" font-size="15" fill="#17324D" text-anchor="start" font-weight="400">Equation 1: x1 + x2 = 2</text>
<line x1="690.0" y1="103.0" x2="760.0" y2="103.0" stroke="#D55E00" stroke-width="3.2" stroke-dasharray="10 7"/>
<text x="770.0" y="109.0" font-size="15" fill="#17324D" text-anchor="start" font-weight="400">Equation 2: x1 + (1 + δ)x2 = 2 + δ</text>
<text x="295.0" y="132.0" font-size="23" fill="#17324D" text-anchor="middle" font-weight="700">δ = 1</text>
<rect x="105.0" y="150.0" width="380.0" height="380.0" fill="#F2F8FC" stroke="#17324D" stroke-width="1.5"/>
<line x1="105.0" y1="150.0" x2="105.0" y2="530.0" stroke="#D9E1E8" stroke-width="1.0"/>
